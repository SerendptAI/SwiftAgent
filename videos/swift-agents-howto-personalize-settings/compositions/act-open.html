<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/tutorial.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #open-scrim {
          opacity: 0;
          visibility: hidden;
        }
        .open-panel-head {
          text-transform: uppercase;
          font-size: 30px;
          color: #0a0a0a;
        }
        .open-panel-note {
          font-size: 19px;
          line-height: 1.75;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          color: #6e6e6e;
        }
        .open-toggle {
          width: 62px;
          height: 34px;
          background: #ededed;
          border-radius: 999px;
        }
      </style>

      <div
        id="root"
        data-composition-id="act-open"
        data-width="1920"
        data-height="1080"
      >
        <div class="hr-stage">
          <!-- The widget card the Settings button lives on -->
          <div
            class="hr-card"
            style="position: absolute; left: 200px; top: 90px; width: 1180px; height: 614px"
          ></div>
          <div
            style="
              position: absolute;
              left: 200px;
              top: 90px;
              width: 277px;
              height: 108px;
              background: #f6f6f6;
              border-bottom-right-radius: 20px;
            "
          ></div>
          <div class="hr-pill" style="left: 210px; top: 98px; height: 92px">
            <svg viewBox="0 0 24 24" style="width: 36px; height: 36px; color: #ffffff">
              <path
                d="M6 9l6 6 6-6"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Widget
          </div>
          <div id="open-settings" class="hr-ghost" style="left: 509px; top: 102px; height: 84px">
            <svg viewBox="0 0 24 24" style="width: 30px; height: 30px; color: #4b5563">
              <path
                d="M3 8h18M3 16h18"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              />
              <circle cx="9" cy="8" r="3" fill="currentColor" />
              <circle cx="15" cy="16" r="3" fill="currentColor" />
            </svg>
            Settings
          </div>

          <div
            style="
              position: absolute;
              left: 248px;
              top: 258px;
              width: 1084px;
              height: 246px;
              border: 2px solid #e5e7eb;
              border-radius: 14px;
              overflow: hidden;
              background: #fbfbfb;
            "
          >
            <div
              class="hr-panel-label"
              style="height: 76px; padding: 0 26px; background: #ffffff; border-bottom: 2px solid #e5e7eb"
            >
              Widget snippet
            </div>
            <div
              class="hr-code"
              style="padding: 30px 28px; font-size: 26px; line-height: 1.75"
            >&lt;script src="https://widget.swiftagents.org/dist/widget-ui.js" data-company-id="4f9a2c71-3e88-4d10-b6c2-0e5b7a91d3f4" data-api-key="YOUR_API_KEY" defer&gt;&lt;/script&gt;</div>
          </div>

          <div
            class="hr-btn"
            style="
              position: absolute;
              left: 248px;
              top: 564px;
              width: 1084px;
              height: 92px;
              font-size: 32px;
              box-shadow: -6px 8px 0px 0px #000000;
            "
          >
            Copy
          </div>

          <!-- The settings drawer, over a scrim, exactly where it opens -->
          <div
            id="open-scrim"
            style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.4)"
          ></div>
          <div
            id="open-panel"
            style="
              position: absolute;
              right: 0;
              top: 0;
              bottom: 0;
              width: 560px;
              background: #ffffff;
              box-shadow: -18px 0 48px rgba(0, 0, 0, 0.18);
              padding: 34px 38px;
            "
          >
            <div
              class="hr-mono"
              style="font-size: 15px; letter-spacing: 0.1em; color: #6e6e6e"
            >
              &lsaquo; Back
            </div>

            <div class="hr-display open-panel-head" style="margin-top: 34px">
              Route to Human
            </div>
            <div class="hr-mono open-panel-note" style="margin-top: 14px">
              Turn off the AI agent and send every widget chat straight to
              your human support team.
            </div>
            <div
              style="
                margin-top: 20px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
              "
            >
              <span class="hr-mono open-panel-note" style="color: #6e6e6e"
                >Route all chats to my support team</span
              >
              <div class="open-toggle"></div>
            </div>

            <div class="hr-display open-panel-head" style="margin-top: 42px">
              Select Agents
            </div>
            <div class="hr-mono open-panel-note" style="margin-top: 14px">
              Which agents are allowed to work in this chatbot
            </div>
            <div class="hr-mono open-panel-note" style="margin-top: 26px; color: #0a0a0a">
              Agent 047
            </div>
            <div class="hr-mono open-panel-note" style="margin-top: 10px">
              Locates any dashboard feature for users.
            </div>
            <div class="hr-mono open-panel-note" style="margin-top: 26px; color: #0a0a0a">
              Agent 007
            </div>
            <div class="hr-mono open-panel-note" style="margin-top: 10px">
              Searches your site&rsquo;s content for custom info.
            </div>
          </div>

          <svg
            id="open-cursor"
            class="hr-cursor"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5 2.5 L5 20 L9.4 16.2 L12.3 22.2 L15.2 20.8 L12.4 15 L18.2 15 Z"
              fill="#0A0A0A"
              stroke="#FFFFFF"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });

          const TIP = { x: 16, y: 8 };
          const OFF = { x: 1640, y: 1180 };
          const to = (x, y) => ({ x: x - TIP.x, y: y - TIP.y });

          tl.set("#open-cursor", { x: OFF.x, y: OFF.y, opacity: 0, scale: 1 }, 0);
          tl.set("#open-settings", { scale: 1 }, 0);
          // The drawer is parked off-stage rather than hidden, so its slide-in
          // reads as the app's own translate-x transition.
          tl.fromTo(
            "#open-panel",
            { x: 560 },
            { x: 560, duration: 0.01 },
            0,
          );

          tl.to(
            "#open-cursor",
            { ...to(600, 144), opacity: 1, duration: 0.9, ease: "power2.out" },
            0.9,
          );
          tl.to("#open-cursor", { scale: 0.88, duration: 0.09 }, 2.1);
          tl.to("#open-cursor", { scale: 1, duration: 0.09 }, 2.19);
          tl.to("#open-settings", { scale: 0.97, duration: 0.1 }, 2.1);
          tl.to("#open-settings", { scale: 1, duration: 0.14 }, 2.2);
          tl.to("#open-cursor", { opacity: 0, duration: 0.25 }, 2.6);

          tl.fromTo(
            "#open-scrim",
            { autoAlpha: 0 },
            { autoAlpha: 1, duration: 0.3, ease: "power2.out" },
            2.5,
          );
          tl.fromTo(
            "#open-panel",
            { x: 560 },
            { x: 0, duration: 0.4, ease: "power2.out" },
            2.5,
          );

          window.__timelines["act-open"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
