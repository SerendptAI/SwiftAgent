<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/tutorial.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        .reg-form {
          position: absolute;
          left: 50%;
          top: 0;
          margin-left: -500px;
          width: 1000px;
        }
        .reg-input {
          width: 1000px;
          margin-top: 12px;
        }
        .reg-textarea {
          width: 1000px;
          height: 128px;
          margin-top: 12px;
        }
        /* Hidden until their beat; the reveals are fromTo, so seeking back
           restores these without a set() at t=0. */
        #reg-options,
        #reg-thanks-scene {
          opacity: 0;
          visibility: hidden;
        }
        .reg-input > .hr-ph {
          position: absolute;
          left: 26px;
          top: 50%;
          margin-top: -16px;
        }
        .reg-textarea > .hr-ph {
          position: absolute;
          left: 26px;
          right: 26px;
          top: 22px;
        }
        .reg-group {
          margin-top: 26px;
        }
        .reg-option {
          height: 62px;
        }
      </style>

      <div
        id="root"
        data-composition-id="act-register"
        data-width="1920"
        data-height="1080"
      >
        <div class="hr-stage">
          <div
            id="reg-surface"
            style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px"
          >
            <div class="reg-form">
              <div
                id="reg-heading"
                class="hr-display"
                style="font-size: 56px; line-height: 1.06; margin-top: 92px"
              >
                Swift Agents<br />Registration form
              </div>

              <div id="reg-g1" class="reg-group" style="margin-top: 42px">
                <div class="hr-label">Company Name</div>
                <div class="hr-input reg-input">
                  <span id="reg-f1-ph" class="hr-ph">Company legal name</span
                  ><span id="reg-f1-val"></span>
                </div>
              </div>

              <div id="reg-g2" class="reg-group">
                <div class="hr-label">Company Email</div>
                <div class="hr-input reg-input">
                  <span id="reg-f2-ph" class="hr-ph">company@email.com</span
                  ><span id="reg-f2-val"></span>
                </div>
              </div>

              <div id="reg-g3" class="reg-group">
                <div class="hr-label">What does your company do</div>
                <div class="hr-textarea reg-textarea">
                  <span id="reg-f3-ph" class="hr-ph"
                    >Brief description of what your company does</span
                  ><span id="reg-f3-val"></span>
                </div>
              </div>

              <div id="reg-g4" class="reg-group">
                <div class="hr-label">
                  Estimated/customer size or Average customer size
                </div>
                <div class="hr-input reg-input">
                  <span id="reg-f4-ph" class="hr-ph">Select customer size</span
                  ><span id="reg-f4-val"></span>
                  <span
                    class="hr-mono"
                    style="margin-left: auto; color: #6e6e6e"
                    >v</span
                  >
                </div>
              </div>

              <div
                id="reg-btn"
                class="hr-btn"
                style="width: 1000px; height: 80px; margin-top: 34px"
              >
                Register
              </div>
            </div>

            <div
              id="reg-options"
              class="hr-menu"
              style="
                position: absolute;
                left: 50%;
                margin-left: -500px;
                width: 1000px;
                top: 839px;
              "
            >
              <div class="hr-option reg-option">1 &ndash; 100</div>
              <div class="hr-option reg-option">101 &ndash; 1,000</div>
              <div class="hr-option reg-option">1,001 &ndash; 10,000</div>
              <div id="reg-opt-pick" class="hr-option reg-option">10,001 &ndash; 100,000</div>
              <div class="hr-option reg-option">100,000+</div>
            </div>
          </div>

          <!-- The approval-pending state, after Register -->
          <div id="reg-thanks-scene" style="position: absolute; inset: 0">
            <div
              id="reg-thanks"
              class="hr-display"
              style="
                position: absolute;
                left: 0;
                right: 0;
                top: 214px;
                text-align: center;
                font-size: 88px;
                line-height: 1.06;
              "
            >
              Thank you for<br />registering!
            </div>
            <div
              id="reg-thanks-sub"
              class="hr-mono"
              style="
                position: absolute;
                left: 0;
                right: 0;
                top: 428px;
                text-align: center;
                font-size: 30px;
                color: #0a0a0a;
              "
            >
              We&rsquo;ll reach out soon!
            </div>
          </div>

          <svg
            id="reg-cursor"
            class="hr-cursor"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5 2.5 L5 20 L9.4 16.2 L12.3 22.2 L15.2 20.8 L12.4 15 L18.2 15 Z"
              fill="#0A0A0A"
              stroke="#FFFFFF"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>
        </div>

      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });

          const NAME = "Chowdeck";
          const EMAIL = "ops@chowdeck.com";
          const DESC =
            "Food delivery across Nigeria. We handle order, rider and refund questions at high volume.";

          // Field centres in unscaled stage space, measured off the layout above.
          const Y_F1 = 328;
          const Y_F2 = 465;
          const Y_F3 = 630;
          const Y_F4 = 795;
          const Y_BTN = 905;

          const TIP = { x: 16, y: 8 };
          const FOCUS_Y = 470;
          const panTo = (y, s) => FOCUS_Y - 540 - (y - 540) * s;
          const at = (x, y, s, ty) => ({
            x: 960 + (x - 960) * s - TIP.x,
            y: 540 + (y - 540) * s + ty - TIP.y,
          });

          const S_WIDE = 0.74;
          const S_STEP = 1.05;
          const TY_WIDE = panTo(600, S_WIDE);
          const TY_F12 = panTo((Y_F1 + Y_F2) / 2, S_STEP);
          const TY_F3 = panTo(Y_F3, S_STEP);
          // The opened select runs 310px below its field, so this beat frames
          // the field and the whole menu — otherwise the last option is sliced
          // off by the stage clip and lands on the caption band.
          const TY_SEL = panTo((Y_F4 + 1149) / 2, S_STEP);
          const OFF = { x: 1640, y: 1180 };

          // ── Beat 1 · the form, whole (0-7s) ──────────────────────
          tl.set("#reg-cursor", { x: OFF.x, y: OFF.y, opacity: 0, scale: 1 }, 0);
          tl.set(
            ["#reg-f1-val", "#reg-f2-val", "#reg-f3-val", "#reg-f4-val"],
            { innerHTML: "" },
            0,
          );
          tl.set(
            ["#reg-f1-ph", "#reg-f2-ph", "#reg-f3-ph", "#reg-f4-ph"],
            { opacity: 1 },
            0,
          );
          tl.set(
            ["#reg-heading", "#reg-g1", "#reg-g2", "#reg-g3", "#reg-g4", "#reg-btn"],
            { autoAlpha: 1 },
            0,
          );
          tl.fromTo(
            "#reg-surface",
            { scale: S_WIDE * 0.98, y: TY_WIDE, opacity: 0 },
            { scale: S_WIDE, y: TY_WIDE, opacity: 1, duration: 0.6, ease: "power2.out" },
            0.1,
          );

          // ── Beat 2 · name + email (7-16s) ────────────────────────
          tl.to("#reg-heading", { autoAlpha: 0, duration: 0.3 }, 7.0);
          tl.to(["#reg-g3", "#reg-g4", "#reg-btn"], { autoAlpha: 0, duration: 0.3 }, 7.0);
          tl.to(
            "#reg-surface",
            { scale: S_STEP, y: TY_F12, duration: 0.7, ease: "power2.out" },
            7.0,
          );
          const pF1 = at(560, Y_F1, S_STEP, TY_F12);
          const pF2 = at(560, Y_F2, S_STEP, TY_F12);
          tl.to(
            "#reg-cursor",
            { x: pF1.x, y: pF1.y, opacity: 1, duration: 0.8, ease: "power2.out" },
            7.3,
          );
          tl.to("#reg-cursor", { scale: 0.88, duration: 0.09 }, 8.2);
          tl.to("#reg-cursor", { scale: 1, duration: 0.09 }, 8.29);
          tl.to("#reg-f1-ph", { opacity: 0, duration: 0.12 }, 8.45);
          for (let i = 1; i <= NAME.length; i++) {
            tl.set("#reg-f1-val", { innerHTML: NAME.slice(0, i) }, 8.55 + i * 0.05);
          }
          const f1End = 8.55 + NAME.length * 0.05;
          tl.to(
            "#reg-cursor",
            { x: pF2.x, y: pF2.y, duration: 0.6, ease: "power2.out" },
            f1End + 0.35,
          );
          tl.to("#reg-cursor", { scale: 0.88, duration: 0.09 }, f1End + 1.0);
          tl.to("#reg-cursor", { scale: 1, duration: 0.09 }, f1End + 1.09);
          tl.to("#reg-f2-ph", { opacity: 0, duration: 0.12 }, f1End + 1.25);
          for (let i = 1; i <= EMAIL.length; i++) {
            tl.set(
              "#reg-f2-val",
              { innerHTML: EMAIL.slice(0, i) },
              f1End + 1.35 + i * 0.042,
            );
          }

          // ── Beat 3 · what you do + volume (16-22s) ───────────────
          tl.to(["#reg-g1", "#reg-g2"], { autoAlpha: 0, duration: 0.3 }, 16.0);
          tl.to("#reg-g3", { autoAlpha: 1, duration: 0.3 }, 16.0);
          tl.to("#reg-g4", { autoAlpha: 0, duration: 0.3 }, 16.0);
          tl.to(
            "#reg-surface",
            { scale: S_STEP, y: TY_F3, duration: 0.7, ease: "power2.out" },
            16.0,
          );
          const pF3 = at(560, Y_F3 - 30, S_STEP, TY_F3);
          tl.to(
            "#reg-cursor",
            { x: pF3.x, y: pF3.y, duration: 0.6, ease: "power2.out" },
            16.2,
          );
          tl.to("#reg-cursor", { scale: 0.88, duration: 0.09 }, 16.9);
          tl.to("#reg-cursor", { scale: 1, duration: 0.09 }, 16.99);
          tl.to("#reg-f3-ph", { opacity: 0, duration: 0.12 }, 17.15);
          for (let i = 1; i <= DESC.length; i++) {
            tl.set("#reg-f3-val", { innerHTML: DESC.slice(0, i) }, 17.25 + i * 0.021);
          }

          // Hand off to the select: its own pan, so the menu has room to open.
          tl.to("#reg-g3", { autoAlpha: 0, duration: 0.3 }, 19.4);
          tl.to("#reg-g4", { autoAlpha: 1, duration: 0.3 }, 19.4);
          tl.to(
            "#reg-surface",
            { scale: S_STEP, y: TY_SEL, duration: 0.6, ease: "power2.out" },
            19.4,
          );
          const pF4 = at(560, Y_F4, S_STEP, TY_SEL);
          tl.to(
            "#reg-cursor",
            { x: pF4.x, y: pF4.y, duration: 0.6, ease: "power2.out" },
            19.7,
          );
          tl.to("#reg-cursor", { scale: 0.88, duration: 0.09 }, 20.1);
          tl.to("#reg-cursor", { scale: 1, duration: 0.09 }, 20.19);
          tl.fromTo(
            "#reg-options",
            { autoAlpha: 0, y: -10 },
            { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out" },
            20.3,
          );
          const pPick = at(560, Y_F4 + 268, S_STEP, TY_SEL);
          tl.to(
            "#reg-cursor",
            { x: pPick.x, y: pPick.y, duration: 0.6, ease: "power2.out" },
            21.0,
          );
          tl.to("#reg-opt-pick", { backgroundColor: "#F3F4F6", duration: 0.15 }, 21.6);
          tl.to("#reg-cursor", { scale: 0.88, duration: 0.09 }, 21.7);
          tl.to("#reg-cursor", { scale: 1, duration: 0.09 }, 21.79);
          tl.to("#reg-options", { autoAlpha: 0, duration: 0.25 }, 22.0);
          tl.to("#reg-f4-ph", { opacity: 0, duration: 0.12 }, 22.0);
          tl.set("#reg-f4-val", { innerHTML: "10,001 &ndash; 100,000" }, 22.12);

          // ── Beat 4 · register, then wait (22-28s) ────────────────
          tl.to(
            ["#reg-heading", "#reg-g1", "#reg-g2", "#reg-btn"],
            { autoAlpha: 1, duration: 0.3 },
            22.6,
          );
          tl.to(
            "#reg-surface",
            { scale: S_WIDE, y: TY_WIDE, duration: 0.6, ease: "power2.out" },
            22.6,
          );
          const pBtn = at(960, Y_BTN, S_WIDE, TY_WIDE);
          tl.to(
            "#reg-cursor",
            { x: pBtn.x, y: pBtn.y, duration: 0.7, ease: "power2.out" },
            22.9,
          );
          // The real button's offset shadow compresses under the press.
          tl.to("#reg-btn", { x: -4, y: 4, duration: 0.1 }, 23.8);
          tl.to("#reg-btn", { x: 0, y: 0, duration: 0.14 }, 23.91);
          tl.to("#reg-cursor", { scale: 0.88, duration: 0.09 }, 23.8);
          tl.to("#reg-cursor", { scale: 1, duration: 0.09 }, 23.89);
          tl.to("#reg-cursor", { opacity: 0, duration: 0.25 }, 24.2);
          tl.to("#reg-surface", { autoAlpha: 0, duration: 0.4 }, 24.4);

          tl.fromTo(
            "#reg-thanks-scene",
            { autoAlpha: 0 },
            { autoAlpha: 1, duration: 0.4 },
            24.8,
          );
          tl.fromTo(
            "#reg-thanks",
            { y: 26, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.55, ease: "power2.out" },
            24.9,
          );
          tl.fromTo(
            "#reg-thanks-sub",
            { opacity: 0 },
            { opacity: 1, duration: 0.45, ease: "power2.out" },
            25.4,
          );

          window.__timelines["act-register"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
