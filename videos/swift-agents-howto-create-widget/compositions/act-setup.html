<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/tutorial.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #setup-info-scene,
        #setup-identity-scene,
        #setup-done-scene {
          opacity: 0;
          visibility: hidden;
        }
        /* The wizard renders these in sentence case; the uppercase on
           .hr-textarea belongs to the registration form only. */
        .setup-identity-text {
          text-transform: none;
          letter-spacing: 0;
        }
        .setup-centre {
          position: absolute;
          left: 0;
          right: 0;
          text-align: center;
        }
        /* The wizard's own step rail, carried across both form beats. */
        .setup-rail {
          position: absolute;
          left: 160px;
          right: 160px;
          top: 40px;
          display: flex;
          gap: 44px;
          padding-bottom: 20px;
          border-bottom: 2px solid #f3f4f6;
          color: #b4b4b4;
        }
        .setup-bar {
          position: absolute;
          left: 160px;
          top: 92px;
          width: 700px;
          height: 8px;
          background: #f3f4f6;
          border-radius: 999px;
          overflow: hidden;
        }
        .setup-bar > i {
          position: absolute;
          left: 0;
          top: 0;
          bottom: 0;
          display: block;
          background: #006be5;
          border-radius: 999px;
        }
      </style>

      <div
        id="root"
        data-composition-id="act-setup"
        data-width="1920"
        data-height="1080"
      >
        <div class="hr-stage">
          <!-- Beat 1 · give us your website -->
          <div id="setup-intro-scene" style="position: absolute; inset: 0">
            <div class="setup-centre hr-display" style="top: 168px; font-size: 62px">
              Let&rsquo;s set up your company
            </div>
            <div
              class="setup-centre hr-mono"
              style="top: 260px; font-size: 25px; color: #6e6e6e"
            >
              Enter your website and we&rsquo;ll prefill your details for you
            </div>

            <div
              id="setup-url"
              class="hr-field"
              style="
                position: absolute;
                left: 50%;
                top: 352px;
                margin-left: -380px;
                width: 760px;
                height: 84px;
              "
            >
              <span id="setup-url-ph" class="hr-code" style="font-size: 26px"
                >https://yourcompany.com</span
              >
              <span
                id="setup-url-val"
                class="hr-code"
                style="font-size: 26px; color: #0a0a0a"
              ></span>
            </div>

            <div
              id="setup-analyze"
              class="hr-btn"
              style="
                position: absolute;
                left: 50%;
                top: 468px;
                margin-left: -380px;
                width: 760px;
                height: 84px;
                font-size: 26px;
              "
            >
              <span id="setup-analyze-label">Analyze my site</span>
            </div>

            <div
              class="setup-centre hr-mono"
              style="top: 588px; font-size: 22px; color: #9a9a9a"
            >
              <span style="text-decoration: underline"
                >Skip, I&rsquo;ll fill it manually</span
              >
            </div>
          </div>

          <!-- Beat 2 · company information, prefilled by the scrape -->
          <div id="setup-info-scene" style="position: absolute; inset: 0">
            <div class="setup-rail hr-mono" style="font-size: 20px">
              <span style="color: #0a0a0a">Company Information</span>
              <span>Company Identity</span>
              <span>Knowledge Sources</span>
              <span>Answer Boundaries</span>
              <span>Voice &amp; Conversation</span>
            </div>
            <div class="setup-bar"><i style="width: 20%"></i></div>

            <div
              style="
                position: absolute;
                left: 160px;
                right: 160px;
                top: 148px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 26px 48px;
              "
            >
              <div>
                <div class="hr-microlabel">Company Name</div>
                <div class="hr-value">Chowdeck</div>
              </div>
              <div>
                <div class="hr-microlabel">Company Website</div>
                <div class="hr-value">https://chowdeck.com</div>
              </div>
              <div>
                <div class="hr-microlabel">Industry</div>
                <div class="hr-value">Food &amp; Delivery</div>
              </div>
              <div>
                <div class="hr-microlabel">Company Size</div>
                <div class="hr-value">201 &ndash; 500</div>
              </div>
              <div>
                <div class="hr-microlabel">Country of Operation</div>
                <div class="hr-value">Nigeria</div>
              </div>
              <div>
                <div class="hr-microlabel">Timezone</div>
                <div class="hr-value">Africa/Lagos (GMT+1)</div>
              </div>
              <div>
                <div class="hr-microlabel">Primary business Email</div>
                <div class="hr-value">ops@chowdeck.com</div>
              </div>
              <div>
                <div class="hr-microlabel">Primary business number</div>
                <div class="hr-value">+234 905 700 4914</div>
              </div>
            </div>

            <div
              id="setup-prefill-flag"
              class="hr-mono"
              style="
                position: absolute;
                left: 160px;
                top: 592px;
                padding: 12px 24px;
                background: #f4f4f4;
                border-radius: 999px;
                font-size: 21px;
                color: #0a0a0a;
              "
            >
              Prefilled from your website &mdash; check it over
            </div>
          </div>

          <!-- Beat 3 · company identity -->
          <div id="setup-identity-scene" style="position: absolute; inset: 0">
            <div class="setup-rail hr-mono" style="font-size: 20px">
              <span>Company Information</span>
              <span style="color: #0a0a0a">Company Identity</span>
              <span>Knowledge Sources</span>
              <span>Answer Boundaries</span>
              <span>Voice &amp; Conversation</span>
            </div>
            <div class="setup-bar"><i style="width: 40%"></i></div>

            <div style="position: absolute; left: 160px; right: 160px; top: 156px">
              <div class="hr-microlabel">What your company does</div>
              <div
                class="hr-textarea setup-identity-text"
                style="margin-top: 10px; height: 122px; font-size: 23px"
              >
                We deliver food, groceries and pharmacy orders across Nigeria,
                and answer order, rider and refund questions at high volume.
              </div>

              <div style="margin-top: 26px" class="hr-microlabel">
                Main problem you solve for customers
              </div>
              <div
                class="hr-textarea setup-identity-text"
                style="margin-top: 10px; height: 92px; font-size: 23px"
              >
                Getting a straight answer about an order without waiting in a
                support queue.
              </div>

              <div
                style="
                  margin-top: 26px;
                  display: grid;
                  grid-template-columns: 1fr 1fr;
                  gap: 48px;
                "
              >
                <div>
                  <div class="hr-microlabel">Brand tone</div>
                  <div class="hr-value">Friendly, direct</div>
                </div>
                <div>
                  <div class="hr-microlabel">Support Emails</div>
                  <div class="hr-value">help@chowdeck.com</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Beat 4 · the questionnaire hand-off -->
          <div id="setup-done-scene" style="position: absolute; inset: 0">
            <div
              id="setup-modal"
              style="
                position: absolute;
                left: 50%;
                top: 96px;
                margin-left: -470px;
                width: 940px;
                padding: 68px 80px 72px;
                background: #ffffff;
                border: 2px solid #f3f4f6;
                box-shadow: 0 24px 64px rgba(0, 0, 0, 0.12);
                text-align: center;
              "
            >
              <div class="hr-display" style="font-size: 50px; line-height: 1.16">
                We&rsquo;d love to get to know your organization better.
              </div>
              <div
                class="hr-mono"
                style="
                  margin-top: 30px;
                  font-size: 23px;
                  line-height: 1.8;
                  color: #6e6e6e;
                "
              >
                Our AI agents have a few questions for you so we can understand
                your organization better
              </div>
              <div
                class="hr-mono"
                style="margin-top: 34px; font-size: 22px; color: #6e6e6e"
              >
                Usually takes 5 minutes
              </div>
              <div
                id="setup-start"
                class="hr-btn"
                style="margin-top: 40px; width: 100%; height: 84px; font-size: 26px"
              >
                Start questioner
              </div>
            </div>
          </div>

          <svg
            id="setup-cursor"
            class="hr-cursor"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5 2.5 L5 20 L9.4 16.2 L12.3 22.2 L15.2 20.8 L12.4 15 L18.2 15 Z"
              fill="#0A0A0A"
              stroke="#FFFFFF"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>
        </div>

      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });

          const URL = "chowdeck.com";
          const TIP = { x: 16, y: 8 };
          const OFF = { x: 1640, y: 1180 };
          const to = (x, y) => ({ x: x - TIP.x, y: y - TIP.y });

          // ── Beat 1 · the website scrape (0-7s) ───────────────────
          tl.set("#setup-cursor", { x: OFF.x, y: OFF.y, opacity: 0, scale: 1 }, 0);
          tl.set("#setup-url-val", { innerHTML: "" }, 0);
          tl.set("#setup-url-ph", { opacity: 1 }, 0);
          tl.set("#setup-analyze-label", { innerHTML: "Analyze my site" }, 0);
          tl.set("#setup-analyze", { x: 0, y: 0 }, 0);
          tl.fromTo(
            "#setup-intro-scene",
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
            0.1,
          );

          tl.to(
            "#setup-cursor",
            { ...to(700, 394), opacity: 1, duration: 0.8, ease: "power2.out" },
            0.8,
          );
          tl.to("#setup-cursor", { scale: 0.88, duration: 0.09 }, 1.7);
          tl.to("#setup-cursor", { scale: 1, duration: 0.09 }, 1.79);
          tl.to("#setup-url-ph", { opacity: 0, duration: 0.12 }, 1.95);
          for (let i = 1; i <= URL.length; i++) {
            tl.set("#setup-url-val", { innerHTML: URL.slice(0, i) }, 2.05 + i * 0.06);
          }
          const urlEnd = 2.05 + URL.length * 0.06;

          tl.to(
            "#setup-cursor",
            { ...to(960, 510), duration: 0.6, ease: "power2.out" },
            urlEnd + 0.3,
          );
          tl.to("#setup-cursor", { scale: 0.88, duration: 0.09 }, urlEnd + 0.95);
          tl.to("#setup-cursor", { scale: 1, duration: 0.09 }, urlEnd + 1.04);
          tl.to("#setup-analyze", { x: -4, y: 4, duration: 0.1 }, urlEnd + 0.95);
          tl.to("#setup-analyze", { x: 0, y: 0, duration: 0.14 }, urlEnd + 1.06);
          // The scrape is what fills the next screen in, so the wait is shown.
          tl.set(
            "#setup-analyze-label",
            { innerHTML: "Analyzing your website&hellip;" },
            urlEnd + 1.2,
          );
          tl.to("#setup-cursor", { opacity: 0, duration: 0.25 }, urlEnd + 1.5);
          tl.to("#setup-intro-scene", { autoAlpha: 0, duration: 0.4 }, 6.5);

          // ── Beat 2 · company information (7-17s) ─────────────────
          tl.fromTo(
            "#setup-info-scene",
            { autoAlpha: 0, y: 16 },
            { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" },
            7.0,
          );
          tl.fromTo(
            "#setup-prefill-flag",
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
            8.4,
          );
          tl.to("#setup-info-scene", { autoAlpha: 0, duration: 0.4 }, 16.5);

          // ── Beat 3 · company identity (17-27s) ───────────────────
          tl.fromTo(
            "#setup-identity-scene",
            { autoAlpha: 0, y: 16 },
            { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" },
            17.0,
          );
          tl.to("#setup-identity-scene", { autoAlpha: 0, duration: 0.4 }, 26.5);

          // ── Beat 4 · the questionnaire hand-off (27-36s) ─────────
          tl.fromTo(
            "#setup-done-scene",
            { autoAlpha: 0 },
            { autoAlpha: 1, duration: 0.4 },
            27.0,
          );
          tl.fromTo(
            "#setup-modal",
            { y: 22, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.55, ease: "power2.out" },
            27.1,
          );

          window.__timelines["act-setup"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
