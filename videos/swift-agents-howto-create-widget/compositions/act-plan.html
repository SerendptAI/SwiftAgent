<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/tutorial.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        /* The card lands locked: blurred snippet, dimmed Copy. */
        #plan-code {
          filter: blur(7px);
        }
        #plan-copy {
          opacity: 0.5;
        }
      </style>

      <div
        id="root"
        data-composition-id="act-plan"
        data-width="1920"
        data-height="1080"
      >
        <div class="hr-stage">
          <div
            class="hr-card"
            style="position: absolute; left: 370px; top: 99px; width: 1180px; height: 614px"
          ></div>

          <div
            style="
              position: absolute;
              left: 370px;
              top: 99px;
              width: 277px;
              height: 108px;
              background: #f6f6f6;
              border-bottom-right-radius: 20px;
            "
          ></div>
          <div class="hr-pill" style="left: 380px; top: 107px; height: 92px">
            <svg viewBox="0 0 24 24" style="width: 36px; height: 36px; color: #ffffff">
              <path
                d="M6 9l6 6 6-6"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Widget
          </div>
          <div class="hr-ghost" style="left: 679px; top: 111px; height: 84px">
            <svg viewBox="0 0 24 24" style="width: 30px; height: 30px; color: #4b5563">
              <path
                d="M3 8h18M3 16h18"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              />
              <circle cx="9" cy="8" r="3" fill="currentColor" />
              <circle cx="15" cy="16" r="3" fill="currentColor" />
            </svg>
            Settings
          </div>

          <!-- The snippet panel, paywalled -->
          <div
            style="
              position: absolute;
              left: 418px;
              top: 267px;
              width: 1084px;
              height: 246px;
              border: 2px solid #e5e7eb;
              border-radius: 14px;
              overflow: hidden;
              background: #fbfbfb;
            "
          >
            <div class="hr-panel-label">Widget snippet</div>
            <div
              id="plan-code"
              class="hr-code"
              data-layout-allow-overlap
              style="padding: 30px 28px; font-size: 26px; line-height: 1.75"
            >&lt;script src="https://widget.swiftagents.org/dist/widget-ui.js" data-company-id="4f9a2c71-3e88-4d10-b6c2-0e5b7a91d3f4" data-api-key="YOUR_API_KEY" defer&gt;&lt;/script&gt;</div>

            <!-- Deliberate layering: a paywall overlay sits on the blurred
                 snippet it is withholding. That is the state being taught. -->
            <div
              id="plan-lock"
              data-layout-allow-overlap
              style="
                position: absolute;
                left: 0;
                top: 0;
                width: 1080px;
                height: 242px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 26px;
                background: rgba(255, 255, 255, 0.62);
              "
            >
              <div
                class="hr-mono"
                style="
                  max-width: 620px;
                  text-align: center;
                  font-size: 24px;
                  font-weight: 500;
                  line-height: 1.5;
                  color: #0a0a0a;
                "
              >
                Subscribe to a plan to unlock your widget code
              </div>
              <div
                id="plan-upgrade"
                class="hr-btn"
                style="width: 320px; height: 68px; font-size: 24px; box-shadow: none"
              >
                <span id="plan-upgrade-label">Upgrade</span>
              </div>
            </div>
          </div>

          <div
            id="plan-hint"
            class="hr-note"
            style="position: absolute; left: 418px; top: 537px; width: 1084px"
          >
            Replace <span class="hr-chip">YOUR_API_KEY</span> with a key from
            <span style="color: #0a0a0a; text-decoration: underline"
              >Settings &rarr; API Keys</span
            >.
          </div>

          <div
            id="plan-copy"
            class="hr-btn"
            style="
              position: absolute;
              left: 418px;
              top: 573px;
              width: 1084px;
              height: 92px;
              font-size: 32px;
              box-shadow: -6px 8px 0px 0px #000000;
            "
          >
            Copy
          </div>

          <svg
            id="plan-cursor"
            class="hr-cursor"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5 2.5 L5 20 L9.4 16.2 L12.3 22.2 L15.2 20.8 L12.4 15 L18.2 15 Z"
              fill="#0A0A0A"
              stroke="#FFFFFF"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>
        </div>

      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });

          const TIP = { x: 16, y: 8 };
          const OFF = { x: 1640, y: 1180 };
          const to = (x, y) => ({ x: x - TIP.x, y: y - TIP.y });

          // ── Beat 1 · the wall (0-8s) ─────────────────────────────
          // The real card blurs the snippet and dims the Copy button until the
          // company is on an active plan. This is the step people hit first and
          // the reason a widget "won't appear" for someone who skipped it.
          tl.set("#plan-cursor", { x: OFF.x, y: OFF.y, opacity: 0, scale: 1 }, 0);
          tl.set("#plan-upgrade-label", { innerHTML: "Upgrade" }, 0);
          tl.set("#plan-upgrade", { scale: 1 }, 0);
          tl.to(
            "#plan-cursor",
            { ...to(960, 445), opacity: 1, duration: 0.9, ease: "power2.out" },
            1.6,
          );
          tl.to("#plan-cursor", { scale: 0.88, duration: 0.09 }, 2.9);
          tl.to("#plan-cursor", { scale: 1, duration: 0.09 }, 2.99);
          tl.to("#plan-upgrade", { scale: 0.97, duration: 0.1 }, 2.9);
          tl.to("#plan-upgrade", { scale: 1, duration: 0.14 }, 3.0);

          // ── Beat 2 · checkout, then the unlock (8-16s) ───────────
          // Checkout itself is the payment provider's screen, not ours, so it
          // is named and skipped rather than reconstructed.
          tl.set(
            "#plan-upgrade-label",
            { innerHTML: "Opening checkout&hellip;" },
            8.4,
          );
          tl.to("#plan-cursor", { opacity: 0, duration: 0.3 }, 9.0);
          tl.fromTo(
            "#plan-lock",
            { autoAlpha: 1 },
            { autoAlpha: 0, duration: 0.6, ease: "power2.out" },
            10.6,
          );
          tl.fromTo(
            "#plan-code",
            { filter: "blur(7px)" },
            { filter: "blur(0px)", duration: 0.7, ease: "power2.out" },
            10.6,
          );
          tl.fromTo(
            "#plan-copy",
            { opacity: 0.5 },
            { opacity: 1, duration: 0.5, ease: "power2.out" },
            10.9,
          );

          window.__timelines["act-plan"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
