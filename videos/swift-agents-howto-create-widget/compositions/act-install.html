<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/tutorial.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #inst-paste,
        #inst-live {
          opacity: 0;
          visibility: hidden;
        }
      </style>

      <div
        id="root"
        data-composition-id="act-install"
        data-width="1920"
        data-height="1080"
      >
        <div class="hr-stage">
          <!-- Beat 1 · paste it into your page.
               Wider than the other stages: at 28px the pasted tag's longest
               line needs 1216px of inner width to stay unwrapped. -->
          <div
            id="inst-editor"
            class="hr-window"
            style="left: 320px; top: 206px; width: 1280px; height: 400px"
          >
            <div class="hr-window-bar">
              <span class="hr-dot"></span>
              <span class="hr-dot"></span>
              <span class="hr-dot"></span>
              <span style="margin-left: 14px">index.html</span>
            </div>
            <div
              class="hr-code"
              style="padding: 28px 32px; font-size: 28px; line-height: 1.9"
            >
              <div id="inst-l1" class="hr-pre">  &lt;/main&gt;</div>
              <div id="inst-paste" class="hr-pre">  &lt;script src="https://widget.swiftagents.org/dist/widget-ui.js"
    data-company-id="4f9a2c71-3e88-4d10-b6c2-0e5b7a91d3f4"
    data-api-key="<span id="inst-key">YOUR_API_KEY</span>" defer&gt;&lt;/script&gt;</div>
              <div id="inst-l3" class="hr-pre">&lt;/body&gt;</div>
            </div>
          </div>

          <!-- Beat 2 · live on your site -->
          <div id="inst-live" style="position: absolute; inset: 0">
            <div
              id="inst-site"
              class="hr-window"
              style="left: 370px; top: 146px; width: 1180px; height: 520px"
            >
              <div class="hr-window-bar">
                <span class="hr-dot"></span>
                <span class="hr-dot"></span>
                <span class="hr-dot"></span>
                <span
                  style="
                    margin-left: 14px;
                    padding: 6px 22px;
                    background: #ffffff;
                    border-radius: 999px;
                  "
                  >chowdeck.com</span
                >
              </div>
              <div style="position: relative; height: 452px">
                <div class="hr-line" style="left: 48px; top: 44px; width: 132px; height: 26px"></div>
                <div class="hr-line" style="right: 48px; top: 48px; width: 90px; height: 18px"></div>
                <div class="hr-line" style="right: 162px; top: 48px; width: 90px; height: 18px"></div>
                <div class="hr-line" style="right: 276px; top: 48px; width: 90px; height: 18px"></div>
                <div class="hr-line" style="left: 48px; top: 150px; width: 620px; height: 42px"></div>
                <div class="hr-line" style="left: 48px; top: 212px; width: 470px; height: 42px"></div>
                <div class="hr-line" style="left: 48px; top: 300px; width: 340px; height: 20px"></div>
                <div class="hr-line" style="left: 48px; top: 336px; width: 400px; height: 20px"></div>
                <div
                  class="hr-line"
                  style="right: 48px; top: 150px; width: 300px; height: 206px; background: #f6f6f6"
                ></div>

                <div
                  id="inst-launcher"
                  style="
                    position: absolute;
                    right: 44px;
                    bottom: 40px;
                    width: 108px;
                    height: 108px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: #006be5;
                    border-radius: 50%;
                    color: #ffffff;
                    box-shadow: 0 14px 34px rgba(0, 107, 229, 0.35);
                  "
                >
                  <svg viewBox="0 0 24 24" style="width: 52px; height: 52px">
                    <path
                      d="M4.5 5.5h15a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H10l-5.5 4v-4H4.5A1.5 1.5 0 0 1 3 15V7a1.5 1.5 0 0 1 1.5-1.5z"
                      fill="currentColor"
                    />
                  </svg>
                </div>
                <div
                  id="inst-ring"
                  style="
                    position: absolute;
                    right: 44px;
                    bottom: 40px;
                    width: 108px;
                    height: 108px;
                    border: 3px solid #006be5;
                    border-radius: 50%;
                  "
                ></div>
              </div>
            </div>
          </div>

          <svg
            id="inst-cursor"
            class="hr-cursor"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5 2.5 L5 20 L9.4 16.2 L12.3 22.2 L15.2 20.8 L12.4 15 L18.2 15 Z"
              fill="#0A0A0A"
              stroke="#FFFFFF"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>
        </div>

      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });

          const KEY_REDACTED = "sa_live_" + "•".repeat(28);
          const TIP = { x: 16, y: 8 };
          const OFF = { x: 1640, y: 1180 };
          const to = (x, y) => ({ x: x - TIP.x, y: y - TIP.y });

          tl.set("#inst-cursor", { x: OFF.x, y: OFF.y, opacity: 0, scale: 1 }, 0);
          tl.set("#inst-l3", { y: -160 }, 0);
          tl.set("#inst-key", { innerHTML: "YOUR_API_KEY" }, 0);
          tl.fromTo(
            "#inst-key",
            { backgroundColor: "rgba(242,176,53,0)" },
            { backgroundColor: "rgba(242,176,53,0)", duration: 0.01 },
            0,
          );
          tl.fromTo(
            "#inst-editor",
            { y: 18, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
            0.2,
          );

          // Pasted, not typed — you arrive here with the snippet on the clipboard.
          tl.fromTo(
            "#inst-paste",
            { autoAlpha: 0, y: -10 },
            { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out" },
            1.8,
          );
          tl.to("#inst-l3", { y: 0, duration: 0.35, ease: "power2.out" }, 1.8);
          tl.fromTo(
            "#inst-paste",
            { backgroundColor: "rgba(242,176,53,0.22)" },
            { backgroundColor: "rgba(242,176,53,0)", duration: 0.9 },
            1.9,
          );

          // Centre of the YOUR_API_KEY token on the tag's third line: the code
          // box starts at x=352, and DM Mono advances 0.6em at this size.
          tl.to(
            "#inst-cursor",
            { ...to(755, 486), opacity: 1, duration: 0.8, ease: "power2.out" },
            9.2,
          );
          tl.to("#inst-cursor", { scale: 0.88, duration: 0.09 }, 10.2);
          tl.to("#inst-cursor", { scale: 1, duration: 0.09 }, 10.29);
          tl.to(
            "#inst-key",
            { backgroundColor: "rgba(242,176,53,0.55)", duration: 0.2 },
            10.5,
          );
          tl.set("#inst-key", { innerHTML: KEY_REDACTED }, 11.2);
          tl.to(
            "#inst-key",
            { backgroundColor: "rgba(242,176,53,0)", duration: 0.5 },
            11.4,
          );
          tl.to("#inst-cursor", { opacity: 0, duration: 0.3 }, 12.5);
          tl.to("#inst-editor", { autoAlpha: 0, duration: 0.45 }, 14.4);

          // ── Beat 2 · live on your site ───────────────────────────
          tl.fromTo(
            "#inst-live",
            { autoAlpha: 0 },
            { autoAlpha: 1, duration: 0.4 },
            15.0,
          );
          tl.fromTo(
            "#inst-site",
            { y: 18, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
            15.1,
          );
          tl.fromTo(
            "#inst-launcher",
            { scale: 0.4, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.7)" },
            16.4,
          );
          tl.fromTo(
            "#inst-ring",
            { scale: 1, opacity: 0.55 },
            { scale: 1.75, opacity: 0, duration: 1.1, ease: "power2.out" },
            17.1,
          );

          window.__timelines["act-install"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
